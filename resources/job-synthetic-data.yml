# One-time generation of the synthetic data the demo ingests, as two independent notebook tasks that
# run in parallel (neither reads the other's output):
#
#   generate_project_data  the six project CSVs (schedule, cost, change orders, NCRs, safety log, daily
#                          reports) into the `project` Volume
#   generate_drawings      1,200 drawing PDFs into the `drawings` Volume; the planted-flaw ground truth
#                          (outputs/drawing_manifest.json, outputs/ground_truth_findings.jsonl) is written
#                          next to the notebook, not into the Volume
#
# Runs on serverless compute: the tasks name no cluster, job cluster or environment, the same way the
# notebooks were executed for their committed outputs (docs/BUILD.md). Each notebook installs its own
# extra dependencies (Faker; ReportLab and Faker, pinned) itself, so it also runs from the notebook UI.
#
#   databricks bundle run job_synthetic_data -t demo --profile DEFAULT
#
# The project-data notebook is deterministic for a given as_of_date (default 2026-11-06). To shift every date
# to another anchor: databricks bundle run job_synthetic_data --notebook-params as_of_date=2026-11-20
# (only that notebook reads the parameter). The drawings notebook always writes the same 1,200 files (seed 42).
resources:
  jobs:
    job_synthetic_data:
      name: bluerridge-synthetic-data
      description: >-
        Blue Ridge LNG PM Co-Pilot: generate the synthetic project data CSVs into
        /Volumes/${var.catalog}/${var.schema_prefix}_landing/project/ and the drawing PDFs into
        /Volumes/${var.catalog}/${var.schema_prefix}_landing/drawings/.
      max_concurrent_runs: 1
      tasks:
        - task_key: generate_project_data
          notebook_task:
            notebook_path: ../01_synthetic_data/01_generate_project_data.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
        - task_key: generate_drawings
          notebook_task:
            notebook_path: ../01_synthetic_data/02_generate_drawings.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
