# Lakebase (Autoscaling Postgres) project for the app's hot path.
#
# Why a `postgres_projects` resource and not `database_instances`: the legacy Provisioned tier
# (`database_instances` / `synced_database_tables`) is retired, and Databricks Apps bind Lakebase through the `postgres`
# resource key (branch + database). CLI v1.20.0's bundle schema has PostgresProject / PostgresSyncedTable, so the project
# and the synced tables are bundle resources. See docs/BUILD.md, "Lakebase + app".
resources:
  postgres_projects:
    bluerridge_pm:
      project_id: bluerridge-pm
      display_name: Blue Ridge PM Co-Pilot hot path
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 1
        autoscaling_limit_max_cu: 1

  # Five synced tables (SNAPSHOT: the gold sources are rewritten with CREATE OR REPLACE and have no Change Data Feed, so
  # TRIGGERED/CONTINUOUS are not an option; a refresh is a re-sync after each gold refresh, see docs/BUILD.md).
  # UC objects land in ${var.catalog}.${var.schema_prefix}_app as <source>_synced; the Postgres table is
  # databricks_postgres.<schema>_app.<source>_synced. drawing_register is deliberately NOT synced (UC row filter would be bypassed).
  postgres_synced_tables:
    kpi_daily_synced:
      synced_table_id: ${var.catalog}.${var.schema_prefix}_app.kpi_daily_synced
      source_table_full_name: ${var.catalog}.${var.schema_prefix}_gold_pm.kpi_daily
      primary_key_columns: [project_id, snapshot_date]
      scheduling_policy: SNAPSHOT
      branch: ${resources.postgres_projects.bluerridge_pm.name}/branches/production
      postgres_database: databricks_postgres
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${var.schema_prefix}_app
    compliance_findings_synced:
      synced_table_id: ${var.catalog}.${var.schema_prefix}_app.compliance_findings_synced
      source_table_full_name: ${var.catalog}.${var.schema_prefix}_gold_pm.compliance_findings
      primary_key_columns: [drawing_id, finding_id]
      scheduling_policy: SNAPSHOT
      branch: ${resources.postgres_projects.bluerridge_pm.name}/branches/production
      postgres_database: databricks_postgres
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${var.schema_prefix}_app
    risk_forecast_synced:
      synced_table_id: ${var.catalog}.${var.schema_prefix}_app.risk_forecast_synced
      source_table_full_name: ${var.catalog}.${var.schema_prefix}_gold_pm.risk_forecast
      primary_key_columns: [milestone_id]
      scheduling_policy: SNAPSHOT
      branch: ${resources.postgres_projects.bluerridge_pm.name}/branches/production
      postgres_database: databricks_postgres
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${var.schema_prefix}_app
    schedule_overdue_synced:
      synced_table_id: ${var.catalog}.${var.schema_prefix}_app.schedule_overdue_synced
      source_table_full_name: ${var.catalog}.${var.schema_prefix}_gold_pm.schedule_overdue
      primary_key_columns: [milestone_id]
      scheduling_policy: SNAPSHOT
      branch: ${resources.postgres_projects.bluerridge_pm.name}/branches/production
      postgres_database: databricks_postgres
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${var.schema_prefix}_app
    daily_brief_synced:
      synced_table_id: ${var.catalog}.${var.schema_prefix}_app.daily_brief_synced
      source_table_full_name: ${var.catalog}.${var.schema_prefix}_gold_pm.daily_brief
      primary_key_columns: [project_id, brief_date]
      scheduling_policy: SNAPSHOT
      branch: ${resources.postgres_projects.bluerridge_pm.name}/branches/production
      postgres_database: databricks_postgres
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${var.schema_prefix}_app
