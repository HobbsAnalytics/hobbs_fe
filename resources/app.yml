# Databricks App: Blue Ridge LNG Project Co-Pilot (React SPA + FastAPI).
#
# Build the frontend BEFORE deploying (09_app/frontend/dist is git-ignored; databricks.yml
# `sync.include` uploads it anyway). See docs/BUILD.md "App build and deploy".
#
# user_api_scopes (on-behalf-of-user) belong on the app resource, not in app.yaml: CLI v1.20.0's
# bundle schema has `resources.apps.*.user_api_scopes` ([Public Preview]).
resources:
  apps:
    pm_copilot_app:
      name: bluerridge-pm-copilot
      description: Blue Ridge LNG Project Manager Co-Pilot (synthetic demo data)
      source_code_path: ../09_app
      user_api_scopes:
        - dashboards.genie   # Genie Conversation API as the signed-in user (Task 18 may adjust)
        - sql                # Genie runs and returns query results through the SQL warehouse as the user
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: ${resources.postgres_projects.bluerridge_pm.name}/branches/production
            database: ${resources.postgres_projects.bluerridge_pm.name}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: genie-space
          genie_space:
            name: ${resources.genie_spaces.bluerridge_pm_copilot.title}
            space_id: ${resources.genie_spaces.bluerridge_pm_copilot.id}
            permission: CAN_RUN
        - name: drawings-volume
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.catalog}.${var.schema_prefix}_landing.drawings
            permission: READ_VOLUME
