# Databricks App runtime config. Resource bindings and OBO scopes are declared on the
# app resource in resources/app.yml (not here); `valueFrom` names match the resource names there.
command:
  - uvicorn
  - backend.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"
env:
  - name: CATALOG
    value: mfg_mc_se_sa
  - name: SCHEMA_PREFIX
    value: bluerridge
  - name: AS_OF_DATE
    value: "2026-11-06"
  - name: WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: GENIE_SPACE_ID
    valueFrom: genie-space
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
